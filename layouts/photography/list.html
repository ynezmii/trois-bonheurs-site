{{ define "main" }}
<section class="page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <div class="filters">
    <label>{{ i18n "filter_album" }}<select data-kind="album"></select></label>
    <label>{{ i18n "filter_ym" }}<select data-kind="ym"></select></label>
    <label>{{ i18n "filter_camera" }}<select data-kind="camera"></select></label>
    <label>{{ i18n "filter_film" }}<select data-kind="film"></select></label>
    <label>{{ i18n "filter_color" }}
      <select data-kind="color">
        <option value="">{{ i18n "all" }}</option>
        <option value="color">{{ i18n "color" }}</option>
        <option value="bw">{{ i18n "bw" }}</option>
      </select>
    </label>
    <p class="count" data-count></p>
  </div>

  <div class="grid" data-filter-grid data-all="{{ i18n "all" }}" data-no-results="{{ i18n "no_results" }}">
    {{ range .Pages }}
    <figure class="card photo" data-item
      data-album="{{ .Params.album }}"
      data-ym="{{ .Date.Format "2006-01" }}"
      data-camera="{{ .Params.camera }}"
      data-film="{{ .Params.film }}"
      data-color="{{ .Params.color }}">
      {{ with .Params.image }}<img src="{{ relURL . }}" alt="" loading="lazy">{{ end }}
      <figcaption>
        <strong>{{ .Title }}</strong>
        <small>{{ .Date.Format "2006-01" }} · {{ .Params.camera }} · {{ .Params.film }}</small>
      </figcaption>
    </figure>
    {{ end }}
    <p class="empty" hidden></p>
  </div>
</section>
{{ end }}
